server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=30s;
    location = /formation-tst { return 301 /formation-tst/; }
    location /formation-tst/api/ {
        set $formation_api formation-tst-api:3000;
        rewrite ^/formation-tst/api/(.*)$ /$1 break;
        proxy_pass http://$formation_api;
    }
    location /formation-tst/ {
        set $formation_front formation-tst:80;
        rewrite ^/formation-tst/(.*)$ /$1 break;
        proxy_pass http://$formation_front;
    }
    location / { try_files $uri $uri/ =404; }
}
